name: sogo_customer
description: SOGO Uganda customer mobile app - vehicle services management.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  url_launcher: ^6.2.0
  flutter_map: ^7.0.2
  image_picker: ^1.1.2
  app_links: ^6.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  latlong2: any
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/onboarding/
